name: Upload Packages

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Zip packages
        run: |
          cd $GITHUB_WORKSPACE
          rm -rf zip/*.zip
          cd p && zip -r ../zip/pg.zip . && cd ..
          cd z && zip -r ../zip/zx.zip . && cd ..
          cd pmin && zip -r ../zip/pgmin.zip . && cd ..
          echo "Zip files created:"
          ls -lh zip/*.zip

      - name: Upload to GitHub Release
        run: |
          cd $GITHUB_WORKSPACE
          TAG="v$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" --title "packages $TAG" --notes "pg/zx/pgmin packages" --target main
          gh release upload "$TAG" zip/pg.zip zip/zx.zip zip/pgmin.zip --clobber
          echo "Uploaded to Release $TAG"

      - name: Upload to R2 (multipart)
        run: |
          cd $GITHUB_WORKSPACE
          export R2_UPLOAD_PASSWORD="${{ secrets.R2_UPLOAD_PASSWORD }}"
          export R2_HOST="https://rhb.d51.dpdns.org"
          python3 .github/scripts/r2_mpu_upload.py zip/pg.zip pg.zip 12
          python3 .github/scripts/r2_mpu_upload.py zip/zx.zip zx.zip 12
          python3 .github/scripts/r2_mpu_upload.py zip/pgmin.zip pgmin.zip 12
          echo "Uploaded to R2"
